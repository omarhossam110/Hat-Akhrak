# Public entry point. Everything goes to the Next.js frontend; the API is NOT
# exposed (the frontend calls it server-side over the internal network).

# Coarse flood guard only (one page load = the page + ~15 link prefetches, and
# several people can share one IP); the API has its own per-IP limits, tighter
# on login/signup/reset.
limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;
limit_req_status 429;
server_tokens off;

# Needed for Next's streaming/websocket (dev tooling) upgrade headers.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream frontend {
  server frontend:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets: many per page, so they are NOT rate limited (a page
  # load would otherwise eat the whole per-IP budget). Pages and actions are.
  location /_next/static/ {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
  }

  location / {
    limit_req zone=perip burst=200 nodelay;

    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # One id per request: the backend logs it, the browser gets it back as a header.
    proxy_set_header X-Request-Id $request_id;
    add_header X-Request-Id $request_id always;
    # OVERWRITE (not append) so a visitor can't spoof their IP by sending their
    # own X-Forwarded-For; the app uses it for per-IP rate limiting.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Behind a TLS-terminating load balancer (Cloudflare etc.) use $http_x_forwarded_proto instead.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}
