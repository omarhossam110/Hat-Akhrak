# Public entry point. Everything goes to the Next.js frontend; the API is NOT
# exposed (the frontend calls it server-side over the internal network).

limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
server_tokens off;

# Needed for Next's streaming/websocket (dev tooling) upgrade headers.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream frontend {
  server frontend:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
  gzip_min_length 1024;

  location / {
    limit_req zone=perip burst=60 nodelay;

    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # OVERWRITE (not append) so a visitor can't spoof their IP by sending their
    # own X-Forwarded-For; the app uses it for per-IP rate limiting.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Behind a TLS-terminating load balancer (Cloudflare etc.) use $http_x_forwarded_proto instead.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}
