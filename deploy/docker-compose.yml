# Hat Akhrak on a single VPS:
#   nginx (public) -> frontend (Next.js) -> backend (NestJS) -> Postgres (same server, in this stack)
#
#   cp .env.example .env     # fill it in
#   docker compose up -d --build
#
# Only nginx is published. Postgres and the backend are reachable from other
# containers only (the backend being private is what makes TRUST_PROXY=1 safe).
# See README.md in this folder.
name: hat-akhrak

# Container logs would otherwise grow without limit and eventually fill the
# disk (and the database lives on it): keep 5 files of 10 MB per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: hat_akhrak
    volumes:
      - dbdata:/var/lib/postgresql/data
    # No `ports:` on purpose — the database is never exposed outside this stack.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hat -d hat_akhrak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Daily compressed dump into ./backups (kept KEEP_DAYS days). Copy that folder
  # off the server too — a backup on the same disk doesn't survive losing the disk.
  backup:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Applies the SQL migrations, then exits. Runs on every `up`; already-applied ones are skipped.
  migrate:
    logging: *default-logging
    build: ${BACKEND_CONTEXT:-../../hat-akhrak-backend}
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: postgresql://hat:${DB_PASSWORD}@db:5432/hat_akhrak
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    logging: *default-logging
    build: ${BACKEND_CONTEXT:-../../hat-akhrak-backend}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://hat:${DB_PASSWORD}@db:5432/hat_akhrak
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      TAX_ID_ENCRYPTION_KEY: ${TAX_ID_ENCRYPTION_KEY:?set TAX_ID_ENCRYPTION_KEY}
      CORS_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      TRUST_PROXY: "1"
      REQUIRE_ADMIN_2FA: ${REQUIRE_ADMIN_2FA:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["3001"]

  frontend:
    logging: *default-logging
    build:
      context: ..
      args:
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001/api
    depends_on:
      backend:
        condition: service_healthy
    expose: ["3000"]

  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"      # uncomment when you enable TLS (see README.md)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  dbdata:
