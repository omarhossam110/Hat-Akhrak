# Hat Akhrak on a single VPS:  nginx (public) -> frontend (Next.js) -> backend (NestJS) -> Postgres
#
#   cp .env.example .env     # fill it in
#   docker compose up -d --build                        # Postgres hosted elsewhere (e.g. Supabase)
#   docker compose --profile local-db up -d --build     # ...or with Postgres in this stack
#
# Only nginx is published. The backend is reachable from the frontend container
# only, which is what makes TRUST_PROXY=1 safe. See README.md in this folder.
name: hat-akhrak

services:
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}   # required when using the local-db profile (postgres refuses to start without it)
      POSTGRES_DB: hat_akhrak
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hat -d hat_akhrak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies the SQL migrations, then exits. Runs on every `up`; already-applied ones are skipped.
  migrate:
    build: ${BACKEND_CONTEXT:-../../hat-akhrak-backend}
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: "no"

  backend:
    build: ${BACKEND_CONTEXT:-../../hat-akhrak-backend}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      TAX_ID_ENCRYPTION_KEY: ${TAX_ID_ENCRYPTION_KEY:?set TAX_ID_ENCRYPTION_KEY}
      CORS_ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      TRUST_PROXY: "1"
      REQUIRE_ADMIN_2FA: ${REQUIRE_ADMIN_2FA:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["3001"]

  frontend:
    build:
      context: ..
      args:
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001/api
    depends_on:
      backend:
        condition: service_healthy
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"      # uncomment when you enable TLS (see README.md)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  dbdata:
