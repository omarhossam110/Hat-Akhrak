name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Pages call the API at request time; the build itself doesn't need it up.
      BACKEND_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # What the sandbox couldn't run: build the real image, boot it, and syntax-check nginx.
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the frontend image
        run: docker build -t hat-frontend .
      - name: Boot it and fetch a page + security headers
        run: |
          docker run -d --name fe -p 3000:3000 -e BACKEND_URL=http://127.0.0.1:9/api hat-frontend
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/ar && break; sleep 2; done
          curl -fsSI http://localhost:3000/ar | tee headers.txt
          grep -qi "x-frame-options: DENY" headers.txt
          docker logs fe | tail -5
      - name: nginx config is valid
        run: |
          docker run --rm --add-host frontend:127.0.0.1 \
            -v "$PWD/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Compose file is valid
        run: |
          cd deploy
          DB_PASSWORD=x JWT_SECRET=x TOTP_ENCRYPTION_KEY=x TAX_ID_ENCRYPTION_KEY=x PUBLIC_URL=http://localhost docker compose config -q
